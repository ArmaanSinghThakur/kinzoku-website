# Local development services. Phase 5 adds the website and Caddy for the server.
#   npm run services:up     start both (waits until they are ready)
#   npm run services:down   stop both; the data stays in the "pgdata" volume until it is removed
name: kinzoku

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kinzoku
      POSTGRES_USER: kinzoku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      # Reachable from this computer only, never from the network. 5433, not 5432, so it can't
      # clash with a PostgreSQL installed directly on Windows.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinzoku -d kinzoku"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Catches every email the site sends locally (nothing reaches real addresses).
  # Inbox: http://localhost:8025
  mail:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # inbox in the browser

  # Nightly backup at 03:30 Amsterdam time (after the 03:00 clean-up): database and uploaded
  # files, kept 14 days in the "backups" volume. npm run backup:now / backup:restore-test.
  backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: kinzoku
      PGDATABASE: kinzoku
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      TZ: Europe/Amsterdam
      KEEP_DAYS: "14"
    volumes:
      - ./scripts/backup:/backup-scripts:ro
      - ./storage/uploads:/uploads:ro
      - backups:/backups
    entrypoint: ["sh", "-c"]
    command: ["echo '30 3 * * * sh /backup-scripts/backup.sh > /proc/1/fd/1 2>&1' | crontab - && exec crond -f -l 8"]

volumes:
  pgdata:
  backups:
